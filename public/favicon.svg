<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <radialGradient id="arenaGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#18233C" />
            <stop offset="100%" stop-color="#0A0F1D" />
        </radialGradient>
        <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#CCFF00" />
            <stop offset="100%" stop-color="#99CC00" />
        </linearGradient>
        <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF6600" />
            <stop offset="100%" stop-color="#FF3300" />
        </linearGradient>
    </defs>
    <!-- Background rounded squircle -->
    <rect width="512" height="512" rx="112" fill="url(#arenaGlow)" />
    <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#24324F" stroke-width="6" />

    <!-- Court Line Accent Lines -->
    <path d="M 60 256 L 452 256" stroke="#24324F" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />
    <circle cx="256" cy="256" r="160" fill="none" stroke="#24324F" stroke-width="4" stroke-dasharray="6 6" opacity="0.4" />

    <!-- Badminton Racket 1 (Diagonal / Left to Right) -->
    <g transform="rotate(-35 256 256)">
        <!-- Handle -->
        <rect x="250" y="320" width="12" height="130" rx="4" fill="#E2E8F0" />
        <rect x="248" y="420" width="16" height="36" rx="4" fill="#FF5500" />
        <!-- Shaft -->
        <rect x="253" y="240" width="6" height="85" fill="#94A3B8" />
        <!-- Head -->
        <ellipse cx="256" cy="150" rx="64" ry="85" fill="none" stroke="#CCFF00" stroke-width="10" />
        <!-- Strings -->
        <line x1="230" y1="80" x2="230" y2="220" stroke="#CCFF00" stroke-width="1.5" opacity="0.4" />
        <line x1="256" y1="68" x2="256" y2="232" stroke="#CCFF00" stroke-width="1.5" opacity="0.4" />
        <line x1="282" y1="80" x2="282" y2="220" stroke="#CCFF00" stroke-width="1.5" opacity="0.4" />
        <line x1="205" y1="120" x2="307" y2="120" stroke="#CCFF00" stroke-width="1.5" opacity="0.4" />
        <line x1="195" y1="150" x2="317" y2="150" stroke="#CCFF00" stroke-width="1.5" opacity="0.4" />
        <line x1="205" y1="180" x2="307" y2="180" stroke="#CCFF00" stroke-width="1.5" opacity="0.4" />
    </g>

    <!-- Shuttlecock (Foreground / Center Accent) -->
    <g transform="translate(256, 256) scale(1.15)">
        <!-- Feathers cone -->
        <polygon points="-40,-50 40,-50 16,10 -16,10" fill="#F8FAFC" opacity="0.95" />
        <!-- Feather ribs -->
        <line x1="-30" y1="-50" x2="-10" y2="10" stroke="#CBD5E1" stroke-width="2.5" />
        <line x1="0" y1="-50" x2="0" y2="10" stroke="#CBD5E1" stroke-width="2.5" />
        <line x1="30" y1="-50" x2="10" y2="10" stroke="#CBD5E1" stroke-width="2.5" />
        <!-- Feather band -->
        <path d="M -30,-22 Q 0,-16 30,-22" stroke="#FF5500" stroke-width="5" fill="none" />
        <!-- Cork base -->
        <ellipse cx="0" cy="18" rx="18" ry="16" fill="url(#voltGrad)" />
        <path d="M -18,18 A 18 16 0 0 0 18 18 Z" fill="#99CC00" />
    </g>
</svg>

